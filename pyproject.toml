[project]
name = "rtlscout-bench"
version = "0.1.0"
description = "Leaderboard tooling for RTL Scout: campaign runner, run recorder, tables, site generator"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    # The engine, pinned to a tag. This pin is how the leaderboard moves to a new rtlscout version (docs/manual.md,
    # "Upgrading rtlscout"). A direct reference is fine here: this project is installed from its checkout and is
    # never uploaded to a package index.
    "rtlscout @ git+https://github.com/huawei-csl/rtlscout@v0.2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["rtlscout_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
