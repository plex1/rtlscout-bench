# The campaign matrix: the one file to edit.
#
#   tasks    what is scored: a benchmark plus its cost metric and the conditions that belong to that metric
#   entries  who is scored:  a model under one fixed set of agent conditions = one leaderboard row
#
# Validate and print the resolved matrix:   python -m rtlscout_bench.config
# Field reference:                          docs/manual.md, "Adding a task" and "Adding a model"

suite: suite-v2                        # written into every run record; bump when a benchmark, the scoring or the agent changes
                                       # v2 (2026-10-12): rtlscout ce38834 (agent messages), provider pin + completion cap
policy:
  open_weights_only: true              # record.py and site.py refuse any model not marked open_weights in data/models.json

tasks:
  tpu-adp:
    benchmark: tpu                     # -> benchmarks/tpu_verilog, benchmarks/tpu_spire
    cost_metric: area_delay_product    # rtlscout --cost-metric
    flags: [--skip-cec]
  jpeg-adp:
    benchmark: jpeg_idct_2d                # -> benchmarks/jpeg_idct_2d_verilog (Verilog only)
    cost_metric: area_delay_product
    flags: [--skip-cec]
  pdpu-adp:
    benchmark: pdpu_dot16_pipe             # -> benchmarks/pdpu_dot16_pipe_verilog (Verilog only)
    cost_metric: area_delay_product
    flags: [--skip-cec]
  fpmul-adp:
    benchmark: fpmul_f16                   # -> benchmarks/fpmul_f16_verilog (Verilog only)
    cost_metric: area_delay_product
    flags: [--skip-cec]                # like the other tasks: the testbench decides correctness (golden/ is provenance)
  alu-adp:                             # the CV32E40P (RISC-V) execution-stage ALU; the testbench is an equivalence checker
    benchmark: cv32e40p_alu                # -> benchmarks/cv32e40p_alu_verilog (Verilog only)
    cost_metric: area_delay_product        # cycles are pinned to upstream's by the testbench, so area x delay is the whole picture
    flags: [--skip-cec]
    enabled: true                      # enabled 2026-10-16 with the campaign that runs every entry on it
  qr-adp-fast:                         # a different metric for a heavy design
    benchmark: qr
    cost_metric: area_delay_product_fast
    flags: [--skip-cec]
    env: {RTLSCOUT_ADP_FAST_TIMEOUT: "3600"}
    heavy: true                        # scheduler: never two heavy tasks at once
    enabled: false
  tpu-area-at-500:                     # same benchmark, different objective = different task
    benchmark: tpu
    cost_metric: area
    target_delay: 500                  # rtlscout --target-delay
    flags: [--skip-cec]
    enabled: false

defaults:
  tasks: [tpu-adp, jpeg-adp, pdpu-adp, fpmul-adp, alu-adp]   # what every entry runs unless it lists its own
  language: verilog
  repeats: 3
  max_steps: 60
  reasoning_effort: default            # provider default; else low | medium | high | off -> RTLSCOUT_REASONING_EFFORT
  agent_backend: react                 # the built-in loop (the only backend the tooling accepts for now)
  flags: []                            # agent-side flags, added to the task's flags
  env:                                 # run conditions for every entry (an entry's own env adds to these)
    RTLSCOUT_OPENROUTER_MAX_TOKENS: "65536"   # cap on one completion, reasoning included: bounds a runaway step
  enabled: true

entries:                               # open-weights models only, for now
  - id: glm-5.2
    model: openrouter:z-ai/glm-5.2
    env: {RTLSCOUT_OPENROUTER_PROVIDERS: z-ai}   # served by the vendor's own endpoint only (no OpenRouter fallback)
  - id: kimi-k3
    model: openrouter:moonshotai/kimi-k3
  - id: nemotron-3-ultra
    model: openrouter:nvidia/nemotron-3-ultra-550b-a55b
  - id: kimi-k3-high                   # same model, second row with a different reasoning effort
    model: openrouter:moonshotai/kimi-k3
    reasoning_effort: high
  - id: glm-5.3-flash
    model: openrouter:z-ai/glm-5.3-flash
    env: {RTLSCOUT_OPENROUTER_PROVIDERS: z-ai}   # served by the vendor's own endpoint only (no OpenRouter fallback)
  - id: glm-5.3-flash-high             # same model one effort level below Z.AI's default (max); levels: low, high, max
    model: openrouter:z-ai/glm-5.3-flash
    reasoning_effort: high
    env: {RTLSCOUT_OPENROUTER_PROVIDERS: z-ai}
  - id: glm-5.2-high                   # GLM 5.2 reasoning deeply: through OpenRouter the default is light thinking, max runs into the cap
    model: openrouter:z-ai/glm-5.2
    reasoning_effort: high
    env: {RTLSCOUT_OPENROUTER_PROVIDERS: z-ai}
  - id: glm-5.2-nothink                # GLM 5.2 with thinking switched off (levels at Z.AI: high, max, off)
    model: openrouter:z-ai/glm-5.2
    reasoning_effort: "off"              # quoted: a bare off is a YAML boolean
    env: {RTLSCOUT_OPENROUTER_PROVIDERS: z-ai}
  - id: deepseek-v4.1-flash            # DeepSeek's default effort is high (levels: low, high, max)
    model: openrouter:deepseek/deepseek-v4.1-flash
    env: {RTLSCOUT_OPENROUTER_PROVIDERS: coreweave}   # one fixed deployment (fp8) instead of OpenRouter's per-request routing
  - id: deepseek-v4.1-flash-1017       # the 2026-10-17 snapshot of V4.1 Flash (open weights on Hugging Face); default effort high
    model: openrouter:deepseek/deepseek-v4.1-flash-1017
    env: {RTLSCOUT_OPENROUTER_PROVIDERS: deepinfra}   # one fp8 deployment; CoreWeave (the V4.1 Flash pin) does not serve this snapshot
  - id: mimo-v2.6-flash                # Xiaomi MiMo-V2.6-Flash (MIT weights); thinking is a toggle at Xiaomi, effort levels map onto it
    model: openrouter:xiaomi/mimo-v2.6-flash
    env: {RTLSCOUT_OPENROUTER_PROVIDERS: xiaomi}   # the vendor's own endpoint (fp8)
  # round 3 (2026-10-14): the labs' flagships and the Qwen family (tpu-adp first, the other tasks from 2026-10-15)
  - id: deepseek-v4-pro                # DeepSeek's flagship (MIT weights); default effort high
    model: openrouter:deepseek/deepseek-v4-pro-0813
    env: {RTLSCOUT_OPENROUTER_PROVIDERS: alibaba}   # DeepSeek's own endpoint is excluded by the OpenRouter account's data policy (it may train on paid data)
  - id: glm-5.3                        # the big sibling of GLM 5.3 Flash; default effort max at Z.AI
    model: openrouter:z-ai/glm-5.3
    env: {RTLSCOUT_OPENROUTER_PROVIDERS: z-ai}
  - id: mimo-v2.6-pro                  # Xiaomi's 1T flagship (MIT weights); thinking on by default
    model: openrouter:xiaomi/mimo-v2.6-pro
    env: {RTLSCOUT_OPENROUTER_PROVIDERS: xiaomi}
  - id: qwen3.8-2.4t                   # the open-weight 2.4T-A95B variant of Qwen3.8 Max; always in thinking mode
    model: openrouter:qwen/qwen3.8-2.4t-a95b
    env: {RTLSCOUT_OPENROUTER_PROVIDERS: alibaba}
  - id: glm-5.2-spire                  # Spire HDL is just another entry; off at first
    model: openrouter:z-ai/glm-5.2
    env: {RTLSCOUT_OPENROUTER_PROVIDERS: z-ai}   # served by the vendor's own endpoint only (no OpenRouter fallback)
    language: spirehdl
    flags: [--fsm-optimize]
    enabled: false
  - id: glm-5.2-spire-autoconfig
    model: openrouter:z-ai/glm-5.2
    env: {RTLSCOUT_OPENROUTER_PROVIDERS: z-ai}   # served by the vendor's own endpoint only (no OpenRouter fallback)
    language: spirehdl
    flags: [--fsm-optimize, --arith-autoconfig]
    enabled: false
